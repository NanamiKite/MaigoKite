name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # CI exercises local model doubles and HTTP/SSE fixtures only.
  MAIGOKITE_SPIKE_LIVE: "0"

jobs:
  backend:
    name: Python checks and acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: python
      NO_PROXY: localhost,127.0.0.1,::1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install native tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep bubblewrap
      - name: Install locked Python check dependencies
        id: dependencies
        # Whole-source type checking includes optional adapters. These extras
        # belong to the check environment, not the default application install.
        run: uv sync --locked --extra dev --extra vectorstores --no-default-groups
      - name: Ruff
        id: ruff
        shell: bash
        run: |
          mkdir -p test-results
          uv run --no-sync ruff check python/ --output-format github | tee test-results/ruff.log
      - name: Mypy
        id: mypy
        # Preserve every check's failure while still collecting the other results.
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p test-results
          uv run --no-sync mypy python/agent --junit-xml test-results/mypy.xml | tee test-results/mypy.log
      - name: Python tests and runtime acceptance
        id: tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 15
        run: >-
          uv run --no-sync python -m pytest python/tests scripts/acceptance
          --ignore=python/tests/spike/test_runtime_spike_live.py
          -ra --tb=short -o faulthandler_timeout=120
          --junitxml=test-results/python.xml
      - name: Summarize Python checks
        if: ${{ always() }}
        env:
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          RUFF_RESULT: ${{ steps.ruff.outcome }}
          MYPY_RESULT: ${{ steps.mypy.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
        shell: bash
        run: |
          printf '## Python checks\n\n| Check | Result |\n| --- | --- |\n| Dependencies | %s |\n| Ruff | %s |\n| Mypy | %s |\n| Pytest and acceptance | %s |\n\nDetails: Ruff file annotations and the python-test-report artifact.\n' \
            "$DEPENDENCIES_RESULT" "$RUFF_RESULT" "$MYPY_RESULT" "$TESTS_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Python test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-test-report
          path: |
            test-results/python.xml
            test-results/ruff.log
            test-results/mypy.log
            test-results/mypy.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The formatting gate compares both PR and push ranges without fetching
          # individual SHAs or mistaking a shallow checkout for an empty baseline.
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        id: dependencies
        env:
          # This job uses jsdom; the build matrix installs the real Electron binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --include=dev --ignore-scripts=false --engine-strict
      - name: ESLint (zero warnings)
        # The full source tree must pass, including files outside the current diff.
        run: npm run lint
      - name: Changed frontend coding standards
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -z "$BASE_COMMIT" ]; then
            BASE_COMMIT=$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree --stdin < /dev/null)
          elif [[ "$BASE_COMMIT" =~ ^0+$ ]]; then
            BASE_COMMIT=$(git hash-object -t tree --stdin < /dev/null)
          fi
          git cat-file -e "$BASE_COMMIT"
          changes=$(mktemp)
          trap 'rm -f -- "$changes"' EXIT
          git diff --relative --name-only --diff-filter=ACMR -z "$BASE_COMMIT" HEAD -- src scripts > "$changes"
          mapfile -d '' changed_files < "$changes"
          files=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              src/api/generated/*) continue ;;
              *.vue|*.ts|*.tsx|*.js|*.mjs|*.cjs) files+=("$file") ;;
            esac
          done
          if ((${#files[@]})); then
            npm run lint:check -- "${files[@]}"
            npm run format:check -- "${files[@]}"
          fi
      - name: Vitest
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 10
        run: npm run test:run -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml
      - name: Upload frontend test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-test-report
          path: web/test-results/vitest.xml
          if-no-files-found: warn
          retention-days: 7

  source-build:
    name: Source build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            build-command: bash scripts/build.sh
          - os: windows-2025
            build-command: ./scripts/build.ps1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"
          python-version: "3.14"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Web and Electron dependencies
        working-directory: web
        run: npm ci --include=dev --foreground-scripts --ignore-scripts=false --engine-strict
      - name: Build Web and check production TypeScript
        run: ${{ matrix.build-command }} web
      - name: Build Electron main and preload
        run: ${{ matrix.build-command }} desktop
      - name: Build Python wheel and sdist
        run: ${{ matrix.build-command }} python

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [backend, frontend, source-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all checks
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BUILD_RESULT: ${{ needs.source-build.result }}
        run: |
          printf 'backend=%s frontend=%s source-build=%s\n' "$BACKEND_RESULT" "$FRONTEND_RESULT" "$BUILD_RESULT"
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$BUILD_RESULT" = success
