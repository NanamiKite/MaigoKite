# MaigoKite Application Configuration

# App settings
app:
  name: "MaigoKite"
  version: "0.1.0"
  environment: "development"

# Model configuration
# NOTE: Actual model names and API Keys are configured by the user in the Settings page.
# Leave these blank/null — they serve as structural templates only.
models:
  chat:
    provider: ""
    default: ""
    base_url: ""
    temperature: 0.7
    max_tokens: 4096
    timeout_seconds: 60
  # Per-endpoint capacity defaults and explicit metadata_api (lmstudio).
  # Unknown remote routes assume 262144; this is not an observed model window.
  # See Configuration.md; endpoint ports never select a product or API path.
  routes: []

# Empty = <installation directory>/.workspace, created on startup.
# Explicit paths override this default; MAIGOKITE_WORKSPACE_ROOT takes precedence.
workspace:
  root: ""

# Browser automation is started lazily. Set executable_path when using an
# existing system Chrome/Chromium instead of Playwright's managed browser.
browser:
  enabled: true
  headless: true
  executable_path: ""

# Tool visibility is independent of permission/approval. TODO and sleep are
# opt-in. Connected MCP tools are selected by each server's allow/deny lists.
tools:
  default_tools: [file_read, file_write, file_edit, glob, grep, exec_command, web_search, web_fetch, browser, skill]
  disabled_tools: []  # Startup ceiling; the settings UI cannot override this.
  # Optional per-process Linux rlimits (util-linux prlimit). Zero preserves host
  # limits; address space is not RSS or an aggregate process-tree memory quota.
  # Windows rejects nonzero values until a native limit backend is integrated.
  command_limits:
    cpu_seconds: 0
    address_space_mb: 0
  # Trusted SDK/toolchain directories only; no automatic access to the host home.
  # Paths are read-only and cannot contain the workspace or Core's private state.
  linux_sandbox:
    allow_read: []
    workspace_cache: true  # Reuse .maigokite/cache within each writable workspace.
  # Optional native Windows backend. Provision explicitly with scripts/sandbox.ps1;
  # enabling this alone never installs accounts, ACLs or WFP rules. Upstream is alpha.
  windows_sandbox:
    enabled: false
    allow_read: []  # Exact, trusted per-user tool directories; not model-controlled.

# Permission settings
permissions:
  default_mode: "workspace"
  # Empty arrays leave the corresponding dimension unrestricted. When set,
  # these allowlists further narrow (never broaden) the ToolPolicy boundary.
  allowlist:
    tools: []
    command_prefixes: []
    paths: []
  circuit_breaker:
    enabled: true
    blocked_patterns:
      - "rm -rf /"
      - "dd if="

storage:
  sqlite_path: "~/.maigokite/data/agent.db"

# Credential management
credentials:
  storage: "os_keychain"

# Skill scanning
skills:
  scan_directories:
    - "./skills/"
    - "~/.maigokite/skills/"

# Explicitly configured Phase 1 stdio MCP servers. Secret values stay outside
# YAML; env_allowlist only passes named variables from the parent environment.
mcp:
  servers: {}

# Observability
observability:
  console_output: true
