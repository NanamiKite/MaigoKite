[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "antenna-design"
version = "0.1.0"
description = "Bounded thin-wire engineering inputs and reproducible solver artifacts"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
engineering = [
    # Reviewed public solver API; upgrades require a numerical compatibility review.
    "pymininec==1.2.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
]
dev = ["ruff>=0.17,<0.18", "mypy>=1.19,<3"]
mcp = ["mcp==1.30.0", "anyio>=4.14.2,<5"]

[project.scripts]
antenna-design = "antenna_workflow.cli:main"
antenna-design-mcp = "antenna_workflow.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/antenna_workflow"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["mininec.*"]
ignore_missing_imports = true
