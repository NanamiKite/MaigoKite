[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maigokite-agent"
version = "0.1.0"
description = "MaigoKite AI Agent - Python backend"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
authors = [
    { name = "NanamiKite" },
]
dependencies = [
    "langchain>=1.3.14,<2",
    "langchain-core>=1.5.0,<2",
    # Response conversion and stream ownership hooks target these integration
    # versions. Review their private APIs before upgrading the pins together.
    "langchain-openai==1.4.0",
    "langchain-anthropic==1.4.8",
    "langchain-ollama==1.1.0",
    "langgraph>=1.2.9,<2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "aiosqlite>=0.20.0",
    # Maintained 1.x SDK: stdio parity without the v2 protocol/HTTP-stack migration.
    "mcp>=1.28,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.51,<1",
    "websockets>=13,<17",
    "anyio>=4,<5",
    "keyring>=25,<26",
    "httpx>=0.27.0",
    # Model discovery pins validated IPs while keeping TLS host verification through proxies.
    "aiohttp>=3.14.2,<4",
    "pydantic>=2.0.0",
    "jsonschema>=4.26.0,<5",
    "referencing>=0.37.0,<1",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "duckduckgo-search>=6.0.0",
    "markdownify>=0.11.0",
    "playwright>=1.48.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
    "types-PyYAML>=6",
    "types-jsonschema>=4",
    "black>=25.11.0",
    "pre-commit>=3.7.0",
]
vectorstores = [
    # Experimental adapters only; not a delivered knowledge/indexing feature.
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "qdrant-client>=1.11.0",
]

[project.scripts]
maigokite-agent = "agent.main:main_cli"

[tool.hatch.build.targets.wheel]
packages = ["python/agent"]

# ---- Ruff ----
[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

# ---- MyPy ----
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["python/tests"]
asyncio_mode = "auto"
